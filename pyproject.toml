[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "homelab-ripe"
version = "0.1.0"
description = "Read-only, evidence-backed homelab update tracker"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.135.1",
  "uvicorn==0.41.0",
  "httpx==0.28.1",
  "jinja2==3.1.6",
  "packaging==26.0",
  "websockets==16.0",
  "tzdata==2026.5",
]

[project.optional-dependencies]
test = ["pytest==9.0.3", "pytest-asyncio==1.3.0"]

[tool.setuptools.packages.find]
include = ["ripe*"]

[tool.setuptools.package-data]
ripe = ["templates/*.html", "static/*", "prompts/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
