<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f6f5f0">
  <title>{% block title %}Ripe{% endblock %} · Homelab update tracker</title>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/app.js" defer></script>
</head>
<body data-page="{% block page %}dashboard{% endblock %}">
  <a class="skip-link" href="#main-content">Skip to content</a>
  <aside class="sidebar" aria-label="Main navigation">
    <a href="/" class="brand" aria-label="Ripe dashboard"><img src="/static/icon.svg" width="40" height="40" alt=""><span>ripe<span class="brand-dot">.</span></span></a>
    <div class="workspace-label"><span class="live-dot"></span> YOUR HOMELAB</div>
    <nav class="nav-links">
      <a href="/" data-nav="dashboard"><span data-icon="grid"></span>Overview</a>
      <a href="/logs" data-nav="logs"><span data-icon="activity"></span>Activity &amp; logs</a>
      <a href="/settings" data-nav="settings"><span data-icon="settings"></span>Settings</a>
    </nav>
    <div class="sidebar-bottom">
      <div class="read-only-card"><span data-icon="shield"></span><strong>Look. Learn. Wait.</strong><p>Stage 1 is read-only.<br>You decide when to update.</p></div>
      <div class="sidebar-foot"><span class="live-dot"></span> Self-hosted, on your terms</div>
    </div>
  </aside>
  <div class="workspace">
    <header class="topbar">
      <div class="breadcrumb">Homelab <span>/</span> <span id="breadcrumb-page">Overview</span></div>
      <div class="topbar-right"><span class="demo-context" id="demo-context" hidden>Demo data</span><span class="readonly-badge"><span data-icon="lock"></span> Read only</span><button id="theme-toggle" type="button" class="icon-button" aria-label="Switch color theme" title="Switch color theme"><span data-icon="moon"></span></button></div>
    </header>
    <main id="main-content" tabindex="-1">{% block content %}{% endblock %}</main>
    <footer class="page-footer"><span>Made for a calmer homelab.</span><span id="footer-timezone">Ripe · Stage 1</span></footer>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
