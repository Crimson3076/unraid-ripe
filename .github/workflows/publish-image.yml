# Publishes Ripe's container image to GitHub Container Registry so Unraid can pull it and show updates
# in the Docker tab: `latest` follows main, releases also get version tags (e.g. 0.3.1), every build gets sha-<commit>.
name: Publish image
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/crimson3076/unraid-ripe
          tags: |
            type=raw,value=latest,enable=${{ github.event_name != 'release' }}
            type=semver,pattern={{version}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=Ripe
            org.opencontainers.image.description=Update tracker for Unraid, Docker and Home Assistant with soak periods and changelog analysis
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
